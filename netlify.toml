[build]
  command = "npm run build"
  publish = "dist"

# SPA: every route falls through to index.html so /m/123, /sealed and /terms work on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
