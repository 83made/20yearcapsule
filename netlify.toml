[build]
  command = "npm run build"
  publish = "dist"

# Routes that have their own pre-rendered HTML (scripts/build-seo.mjs) must be matched BEFORE the
# SPA catch-all below, because redirect rules are evaluated in order and the catch-all would
# otherwise swallow them. Without these, /gift served the homepage's markup while only /gift/ got
# the right one — and the link people actually share has no trailing slash.
#
# Adding a route to build-seo.mjs means adding a rule here too.
[[redirects]]
  from = "/gift"
  to = "/gift/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms/index.html"
  status = 200

# SPA: every other route falls through to index.html so /m/123, /g/:token and /sealed work on
# refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # The page loads its own bundle, Google Fonts, and talks to Supabase. Nothing else, ever.
    # googletagmanager.com is allowed as a SOURCE, but 'unsafe-inline' is still absent from
    # script-src: the gtag init lives in /analytics.js rather than inline, so adding the tag did
    # not cost the one CSP directive that actually stops XSS.
    # 'unsafe-inline' is for styles only: React sets a few inline style attributes (the redaction
    # bar widths are computed from character counts). No inline script is permitted, which is the
    # part that actually matters for XSS.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://epuvokgfcxwmpniguzyy.supabase.co https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; form-action 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
