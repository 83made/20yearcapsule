<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Icons. The .ico must exist as a real file: browsers and iOS request /favicon.ico and
         /apple-touch-icon.png whether or not they are declared, and the SPA catch-all was
         answering those with index.html, so a home-screen save got a page of HTML as its icon.
         The .ico carries a different drawing at 16-48px than at 64px+ — with the pressed ring
         in it, "20" is an unreadable smear in a browser tab. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>The 20 Year Capsule — one sentence, sealed until 2047</title>
    <meta name="description" content="Write one sentence. It gets sealed on December 31, 2026 and nobody reads it - not even you - until January 1, 2047." />

    <!-- Social preview. A link with no image is a dead link in iMessage, Slack and every feed,
         which matters here because the whole early phase depends on people sending it to friends. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The 20 Year Capsule" />
    <meta property="og:url" content="https://20yearcapsule.com/" />
    <meta property="og:title" content="Say something to 2047." />
    <meta property="og:description" content="$2, 100 characters, sealed for twenty years. Nobody reads it - not even you - until January 1, 2047." />
    <meta property="og:image" content="https://20yearcapsule.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Say something to 2047." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Say something to 2047." />
    <meta name="twitter:description" content="$2, 100 characters, sealed for twenty years. Opens January 1, 2047." />
    <meta name="twitter:image" content="https://20yearcapsule.com/og.png" />
    <meta name="theme-color" content="#f4f1e8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
